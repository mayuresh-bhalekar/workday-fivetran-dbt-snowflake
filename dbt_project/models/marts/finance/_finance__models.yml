version: 2

models:
  - name: dim_gl_account
    description: Conformed GL account (Chart of Accounts) dimension, SCD Type 1.
    columns:
      - name: gl_account_id
        tests: [unique, not_null]
      - name: account_type
        tests:
          - accepted_values:
              values: ['Asset', 'Liability', 'Equity', 'Revenue', 'Expense']

  - name: dim_cost_center
    description: >
      Conformed cost center dimension, SCD Type 1. Conforms to dim_department
      (MARTS_CORE) via department_id — the Finance <-> HCM bus-matrix join.
    columns:
      - name: cost_center_id
        tests: [unique, not_null]
      - name: department_id
        tests:
          - relationships:
              to: ref('dim_department')
              field: department_id

  - name: fact_gl_transactions
    description: >
      Atomic fact. Grain: one row per GL journal line. Additive measure:
      amount (signed, debit positive / credit negative).
    columns:
      - name: gl_transaction_key
        tests: [unique, not_null]
      - name: gl_transaction_id
        tests: [unique, not_null]
      - name: journal_entry_id
        tests: [not_null]
      - name: gl_account_id
        tests:
          - relationships:
              to: ref('dim_gl_account')
              field: gl_account_id
      - name: cost_center_id
        tests:
          - relationships:
              to: ref('dim_cost_center')
              field: cost_center_id
      - name: amount
        tests: [not_null]
