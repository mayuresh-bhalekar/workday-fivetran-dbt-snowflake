version: 2

models:
  - name: dim_employee
    description: >
      Conformed employee dimension, SCD Type 2. One row per employee per
      job/department/manager/comp version. Join facts to the row where
      fact_date between valid_from and valid_to for point-in-time accuracy,
      or filter is_current = true for "as of today".
    meta:
      metrics:
        employee_count:
          type: count
          sql: ${employee_id}
          label: Employee Count
          description: Count of employee dimension rows (filter is_current for headcount).
        distinct_employee_count:
          type: count_distinct
          sql: ${employee_id}
          label: Distinct Employees
          description: Distinct employees, safe to use without an is_current filter (e.g. new hires by month) since dim_employee has multiple SCD2 rows per employee.
        avg_tenure_years:
          type: average
          sql: datediff('year', ${hire_date}, coalesce(${termination_date}, current_date()))
          label: Average Tenure (Years)
          description: Average years from hire date to termination date, or to today for active employees.
          round: 1
    columns:
      - name: employee_key
        description: Surrogate key (employee_id + valid_from hash). Grain PK.
        tests: [unique, not_null]
      - name: employee_id
        description: Workday natural key.
        tests: [not_null]
      - name: full_name
        description: Employee's full name.
      - name: job_title
        description: Denormalized job title, joined from dim_position.
      - name: department_name
        description: Denormalized department name, joined from dim_department.
      - name: location_name
        description: Denormalized location name, joined from dim_location.
      - name: hire_date
        description: Date the employee was hired.
      - name: termination_date
        description: Date the employee was terminated, null if still employed.
      - name: worker_status
        tests:
          - accepted_values:
              values: ['Active', 'Terminated', 'Leave']
      - name: department_id
        tests:
          - relationships:
              to: ref('dim_department')
              field: department_id
      - name: position_id
        tests:
          - relationships:
              to: ref('dim_position')
              field: position_id
      - name: is_current
        tests: [not_null]

  - name: dim_department
    description: Conformed department dimension, SCD Type 1.
    columns:
      - name: department_id
        tests: [unique, not_null]

  - name: dim_position
    description: Conformed position dimension, SCD Type 1.
    columns:
      - name: position_id
        tests: [unique, not_null]

  - name: dim_location
    description: Conformed location dimension, SCD Type 1.
    columns:
      - name: location_id
        tests: [unique, not_null]

  - name: dim_date
    description: Generated calendar spine, 2015-01-01 through 2030-12-31.
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: date_day
        tests: [unique, not_null]
