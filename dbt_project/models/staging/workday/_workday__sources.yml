version: 2

sources:
  - name: workday
    database: HR_ANALYTICS
    schema: RAW
    description: >
      Fivetran-owned RAW replica of Workday HCM/Payroll/Time/Benefits data,
      synced via the Workday RaaS/API connector. Append-only; treat as read-only.
    loaded_at_field: _fivetran_synced
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: workday_departments
        description: Workday Supervisory Organization export.
        columns:
          - name: DEPARTMENT_ID
            tests: [unique, not_null]
      - name: workday_locations
        description: Workday Location master data.
        columns:
          - name: LOCATION_ID
            tests: [unique, not_null]
      - name: workday_positions
        description: Workday Position / Job Profile export.
        columns:
          - name: POSITION_ID
            tests: [unique, not_null]
      - name: workday_workers
        description: >
          Workday Worker export, effective-dated. Fivetran surfaces every
          historical version of a worker row when Workday emits it — this
          feeds the SCD2 snapshot (snapshots/snap_workers.sql).
        loaded_at_field: _fivetran_synced
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: EMPLOYEE_ID
            tests: [not_null]
      - name: workday_time_entries
        description: Workday Time Entry export (one row per clocked time block/day).
        loaded_at_field: _fivetran_synced
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 6, period: hour}
        columns:
          - name: TIME_ENTRY_ID
            tests: [unique, not_null]
      - name: workday_pay_results
        description: Workday Pay Result export (one row per worker/pay-period/earning-deduction code).
        columns:
          - name: PAY_RESULT_ID
            tests: [unique, not_null]
      - name: workday_benefits_enrollment
        description: Workday Benefit Election export.
        columns:
          - name: ENROLLMENT_ID
            tests: [unique, not_null]

      # -- Student (Workday Student / Enrollment) ---------------------------
      - name: workday_academic_periods
        description: Workday Academic Period (term) master data.
        columns:
          - name: ACADEMIC_PERIOD_ID
            tests: [unique, not_null]
      - name: workday_programs
        description: Workday Program of Study export.
        columns:
          - name: PROGRAM_ID
            tests: [unique, not_null]
      - name: workday_students
        description: >
          Workday Student export, effective-dated on enrollment status /
          program changes — feeds the SCD2 snapshot
          (snapshots/snap_students.sql), same pattern as workday_workers.
        loaded_at_field: _fivetran_synced
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: STUDENT_ID
            tests: [not_null]
      - name: workday_course_registrations
        description: Workday Course Registration (Enrollment) export.
        columns:
          - name: REGISTRATION_ID
            tests: [unique, not_null]

      # -- Finance (Workday Financials) --------------------------------------
      - name: workday_ledger_accounts
        description: Workday Ledger Account (Chart of Accounts) export.
        columns:
          - name: GL_ACCOUNT_ID
            tests: [unique, not_null]
      - name: workday_cost_centers
        description: >
          Workday Cost Center export. COST_CENTER_ID conforms to the
          COST_CENTER value already carried on workday_departments — Finance
          and HCM share this dimension.
        columns:
          - name: COST_CENTER_ID
            tests: [unique, not_null]
      - name: workday_gl_transactions
        description: Workday General Ledger journal line export.
        loaded_at_field: _fivetran_synced
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: GL_TRANSACTION_ID
            tests: [unique, not_null]
